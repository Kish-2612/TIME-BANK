<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications — TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="notifications">
  <div class="app-layout">
    <aside class="sidebar" data-sidebar></aside>
    <div>
      <header class="navbar" data-nav></header>
      <main class="app-main">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;">
          <div>
            <p class="eyebrow">Alerts</p>
            <h1 class="section-title">Notification center</h1>
          </div>
          <button class="btn btn-ghost" type="button" data-mark-read>Mark all read</button>
        </div>
        <div style="display:grid;gap:10px;margin-top:22px;" data-notes></div>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="mobile-menu" data-mobile-menu></div>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/notifications.js"></script>
</body>
</html>
