<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="login">
  <a class="skip-link" href="#login">Skip to login</a>
  <div class="auth-layout">
    <section class="auth-visual grid-bg">
      <a class="logo" href="index.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h10M8 3c0 4 3 6 4 9-1 3-4 5-4 9M16 3c0 4-3 6-4 9 1 3 4 5 4 9M7 21h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        TIMEBANK
      </a>
      <div>
        <p class="eyebrow">Ledger of hours</p>
        <h2 class="section-title">An hour given is an hour owned.</h2>
        <div class="wallet-ring" style="max-width:220px;margin-top:28px;">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="90"></circle>
            <circle class="progress" cx="100" cy="100" r="90" stroke-dasharray="565" stroke-dashoffset="180"></circle>
          </svg>
        </div>
      </div>
      <p class="muted">Your time has value.</p>
    </section>
    <section class="auth-panel" id="login">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in to your TimeBank</h1>
      <form data-login-form novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <span class="field-error" data-error="email"></span>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <span class="field-error" data-error="password"></span>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:18px;">
          <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
          <a href="#" style="color:var(--color-primary);">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log In</button>
      </form>
      <p class="muted" style="margin-top:18px;">Don't have an account? <a href="register.html" style="color:var(--color-primary);">Create Account</a></p>
    </section>
  </div>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
