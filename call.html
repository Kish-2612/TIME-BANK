<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video call - TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="call">
  <div class="app-layout">
    <aside class="sidebar" data-sidebar></aside>
    <div>
      <header class="navbar" data-nav></header>
      <main class="app-main">
        <p class="eyebrow">Time exchange</p>
        <h1 class="section-title" data-call-title>Video call</h1>
        <p class="muted" data-call-status>Connecting to the call...</p>
        <div class="meta-row" style="margin-top:12px;">
          <span data-call-participants>Provider and requester</span>
          <span data-call-duration>Duration: --</span>
          <span data-call-window>Scheduled: --</span>
        </div>
        <div class="cards-grid" style="margin-top:22px;grid-template-columns:repeat(2,minmax(0,1fr));">
          <article class="dark-card">
            <p class="eyebrow">You</p>
            <video data-local-video autoplay muted playsinline style="width:100%;aspect-ratio:16/9;background:#02070d;object-fit:cover;border-radius:var(--radius-sm);margin-top:12px;"></video>
          </article>
          <article class="dark-card">
            <p class="eyebrow">Other participant</p>
            <video data-remote-video autoplay playsinline style="width:100%;aspect-ratio:16/9;background:#02070d;object-fit:cover;border-radius:var(--radius-sm);margin-top:12px;"></video>
          </article>
        </div>
        <div class="dark-card" style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div>
            <div class="label">Time remaining</div>
            <div class="value num" data-call-timer>--:--</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-ghost" type="button" data-toggle-mic>Mute microphone</button>
            <button class="btn btn-ghost" type="button" data-toggle-camera>Turn camera off</button>
            <button class="btn btn-ghost" type="button" data-enable-audio hidden>Enable audio</button>
            <button class="btn btn-danger" type="button" data-leave>Leave call</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" data-bottom-nav aria-label="Mobile"></nav>
  <div class="mobile-menu" data-mobile-menu></div>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/call.js"></script>
</body>
</html>
