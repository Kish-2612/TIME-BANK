<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="profile">
  <header class="navbar" data-nav></header>
  <div class="mobile-menu" data-mobile-menu></div>
  <main class="section" style="padding-top:32px;">
    <div class="container">
      <div class="profile-hero">
        <div class="avatar" data-profile-avatar>AR</div>
        <div>
          <p class="verified" data-verified>Verified member</p>
          <h1 class="section-title" data-profile-name>Alex Rivera</h1>
          <p class="muted" data-profile-meta></p>
          <p style="margin-top:12px;max-width:60ch;" data-profile-bio></p>
          <div style="margin-top:14px;" data-skills></div>
        </div>
        <div class="match-ring" style="width:140px;height:140px;justify-self:end;">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"></circle>
            <circle data-rep-ring cx="60" cy="60" r="54" fill="none" stroke="#35E0D0" stroke-width="8" stroke-linecap="round"></circle>
          </svg>
          <div class="center"><span data-rep-label>0</span></div>
        </div>
      </div>
      <div class="stats-row" style="margin-top:28px;">
        <div class="stat-cell"><div class="num" data-given>0</div><span>hrs given</span></div>
        <div class="stat-cell"><div class="num" data-received>0</div><span>hrs received</span></div>
        <div class="stat-cell"><div class="num" data-rating>0</div><span>rating</span></div>
        <div class="stat-cell"><div class="num" data-helped>0</div><span>people helped</span></div>
      </div>
      <h2 style="margin:32px 0 16px;">Reviews</h2>
      <div class="cards-grid" data-reviews></div>
    </div>
  </main>
  <footer class="app-footer" data-footer></footer>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
