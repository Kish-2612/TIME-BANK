<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Pool — TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="community">
  <header class="navbar" data-nav></header>
  <div class="mobile-menu" data-mobile-menu></div>
  <main class="section">
    <div class="container pool-hero">
      <div>
        <p class="eyebrow">Social impact</p>
        <h1 class="section-title">Give Time. Create Impact.</h1>
        <p class="section-kicker">Donate unused Time Credits to help people who cannot afford to give time back.</p>
        <button class="btn btn-gold" type="button" data-donate>Donate Time</button>
      </div>
      <article class="pool-stat">
        <p class="eyebrow">Community Pool</p>
        <div class="num" data-pool-hours>0</div>
        <p class="muted">hours held in trust</p>
        <div class="meta-row" style="color:var(--color-text-muted);">
          <span>Donated by <strong data-pool-donors>0</strong> members</span>
          <span>People helped <strong data-pool-helped>0</strong></span>
        </div>
      </article>
    </div>
  </main>
  <footer class="app-footer" data-footer></footer>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/community.js"></script>
</body>
</html>
