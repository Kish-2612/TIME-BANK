<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publish a service — TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="offer">
  <div class="app-layout">
    <aside class="sidebar" data-sidebar></aside>
    <div>
      <header class="navbar" data-nav></header>
      <main class="app-main">
        <p class="eyebrow">My services</p>
        <h1 class="section-title">Offer an hour</h1>
        <form class="dark-card" data-offer-form novalidate style="max-width:640px;margin-top:22px;">
          <div class="form-field">
            <label for="title">Title</label>
            <input id="title" name="title" required>
            <span class="field-error" data-error="title"></span>
          </div>
          <div class="form-field">
            <label for="category">Skill Category</label>
            <select id="category" name="category" required>
              <option value="">Select a category</option>
            </select>
            <span class="field-error" data-error="category"></span>
          </div>
          <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>
            <span class="field-error" data-error="description"></span>
          </div>
          <div class="form-field">
            <label for="duration">Duration (hours)</label>
            <input id="duration" name="duration" type="number" min="0.5" step="0.5" value="1" required>
            <span class="field-error" data-error="duration"></span>
          </div>
          <div class="form-field">
            <label for="availability">Availability</label>
            <input id="availability" name="availability" placeholder="Weeknights, weekends..." required>
            <span class="field-error" data-error="availability"></span>
          </div>
          <div class="form-field">
            <label for="location">Location</label>
            <input id="location" name="location" placeholder="Online or city" required>
            <span class="field-error" data-error="location"></span>
          </div>
          <div class="form-field">
            <label for="mode">Online / In Person</label>
            <select id="mode" name="mode">
              <option>Online</option>
              <option>In Person</option>
            </select>
          </div>
          <div class="form-field">
            <label for="cost">Time Credit value</label>
            <input id="cost" name="cost" type="number" min="0.5" step="0.5" value="1" required>
            <span class="field-error" data-error="cost"></span>
          </div>
          <button class="btn btn-primary" type="submit">Publish Service</button>
        </form>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="mobile-menu" data-mobile-menu></div>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/offer.js"></script>
</body>
</html>
