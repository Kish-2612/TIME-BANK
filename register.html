<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — TimeBank</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-shell" data-page="register">
  <div class="auth-layout">
    <section class="auth-visual grid-bg">
      <a class="logo" href="index.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h10M8 3c0 4 3 6 4 9-1 3-4 5-4 9M16 3c0 4-3 6-4 9 1 3 4 5 4 9M7 21h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        TIMEBANK
      </a>
      <div>
        <p class="eyebrow">Open a time account</p>
        <h2 class="section-title">Start with the hours you already have.</h2>
      </div>
      <p class="muted">Give an hour. Earn an hour.</p>
    </section>
    <section class="auth-panel">
      <p class="eyebrow">New member</p>
      <h1>Create My TimeBank</h1>
      <form data-register-form novalidate>
        <div class="form-field">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" required>
          <span class="field-error" data-error="fullName"></span>
        </div>
        <div class="form-field">
          <label for="username">Username</label>
          <input id="username" name="username" required>
          <span class="field-error" data-error="username"></span>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <span class="field-error" data-error="email"></span>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>
          <div class="strength" data-strength><span></span></div>
          <span class="field-error" data-error="password"></span>
        </div>
        <div class="form-field">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" required>
          <span class="field-error" data-error="confirm"></span>
        </div>
        <div class="form-field">
          <label for="skills">Skills (optional)</label>
          <input id="skills" name="skills" placeholder="Design, tutoring, repair...">
        </div>
        <div class="form-field">
          <label for="location">Location (optional)</label>
          <input id="location" name="location" placeholder="City or Online">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create My TimeBank</button>
      </form>
      <p class="muted" style="margin-top:18px;">Already banking time? <a href="login.html" style="color:var(--color-primary);">Log In</a></p>
    </section>
  </div>
  <div class="toast-stack" data-toast-root></div>
  <div class="modal-root" data-modal-root></div>
  <script src="js/runtime-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
